# Backend on Render + Postgres. Frontend deploys separately on Vercel.
services:
  - type: web
    name: subscription-tracker-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn -b 0.0.0.0:$PORT 'app:app'
    healthCheckPath: /
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "30"
      - key: DATABASE_URI
        fromDatabase:
          name: subscription-tracker-db
          property: connectionString
      # Set after Vercel deploy — e.g. https://renewly.vercel.app (no trailing slash)
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: subscription-tracker-db
    plan: free
